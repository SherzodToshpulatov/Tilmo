name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. **Do not include private messages or personal information.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Tilmo behave? Mockups welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Telegram Web
        - Instagram
        - New website
        - Languages
        - Translators / providers
        - Translate panel or popup
        - Privacy / permissions
        - Other
  - type: textarea
    id: privacy
    attributes:
      label: Privacy considerations
      description: Would this read, send, or store any additional data, or need new permissions?
